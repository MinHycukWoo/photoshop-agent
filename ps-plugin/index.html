<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { padding: 12px; color: var(--uxp-host-text-color); font-size: 12px; }
    .row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .dot { width: 10px; height: 10px; border-radius: 5px; background: #888; }
    .dot.on { background: #3fb950; }
    .dot.wait { background: #d29922; }
    #log { font-size: 11px; opacity: 0.75; white-space: pre-wrap; max-height: 90px; overflow-y: auto; }
  </style>
</head>
<body>
  <div class="row">
    <div id="dot" class="dot"></div>
    <span id="state">연결 안 됨</span>
  </div>
  <div class="row">
    <sp-button id="connectBtn" variant="cta">연결</sp-button>
  </div>
  <div id="log"></div>
  <script src="main.js"></script>
</body>
</html>
